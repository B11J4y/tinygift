<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#2a050c;--red:#9b1528;--rose:#ff9aa8;--gold:#f5c97a;--ink:#fff1ee;--paper:#fbeee6;--pen:#6b1a2a;--script:"Great Vibes",cursive;--hand:"Caveat",cursive;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body[data-lang=vi]{--script:"Dancing Script",cursive;--hand:"Dancing Script",cursive}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(110% 80% at 50% 0%,#b01a30aa,transparent 70%),conic-gradient(#ffffff0f 25%,#0000 0 50%,#ffffff0f 0 75%,#0000 0) 0 0/64px 64px,var(--bg);color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:20px;padding:64px 22px 40px;text-align:center;opacity:0;pointer-events:none;transition:opacity 1s ease;overflow-y:auto}
.scene.on{opacity:1;pointer-events:auto}
h1{font-family:var(--script),serif;font-weight:400;font-size:clamp(44px,13vw,84px);line-height:1.15;color:#fff;text-shadow:0 0 12px #fff8,0 0 34px var(--rose),0 0 70px #e0304f}
p{font-size:clamp(19px,5vw,24px);line-height:1.5;max-width:30ch}
.big{font-family:var(--script),serif;font-size:clamp(28px,8vw,44px);line-height:1.3;color:#fff;max-width:18ch;text-shadow:0 0 18px #e0304f}
.hint{font-style:italic;opacity:.75;font-size:18px}
button,.btn{font:600 18px "Cormorant Garamond",Georgia,serif;color:#3a0610;background:var(--gold);border:0;border-radius:999px;padding:13px 30px;cursor:pointer;min-height:48px;text-decoration:none;display:inline-flex;align-items:center}
button.sec{background:#ffffff1f;color:var(--ink);border:1px solid #ffffff44}
button:focus-visible,.tag:focus-visible,.slot:focus-visible,.tile:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.btn:focus-visible,svg:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
.age{font-family:var(--script),serif;font-size:clamp(64px,20vw,110px);line-height:1;color:var(--rose);text-shadow:0 0 30px #e0304f}
.clock{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(360px,100%)}
.clock div{background:#0006;border:1px solid #ff9aa866;border-radius:12px;padding:14px 4px}
.clock b{display:block;font-size:clamp(30px,9vw,42px);font-weight:600;color:#fff;font-variant-numeric:tabular-nums}
.clock span{font-size:14px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
#lang{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;display:flex;gap:5px;z-index:20}
#lang button,#gear{min-height:36px;padding:6px 10px;font-size:15px;background:#ffffff1f;color:var(--ink);border:1px solid #ffffff33}
#lang button[aria-pressed=true]{background:var(--gold);color:#3a0610}
#gear{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;z-index:20}
.gift{width:min(220px,60vw);cursor:pointer;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-2deg)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(340px,100%)}
.tile{flex-direction:column;justify-content:center;gap:6px;height:130px;padding:8px;background:var(--paper);color:var(--pen);border:3px solid var(--red);border-radius:16px;font-size:18px;line-height:1.2}
.tile em{font-style:normal;font-size:40px}
#cake{width:min(420px,94vw);cursor:pointer;overflow:visible}
.tier,.candle{opacity:0}
.built .tier{animation:drop .7s cubic-bezier(.3,1.5,.5,1) both}
.built .t2{animation-delay:.6s}.built .t3{animation-delay:1.2s}
.built .candle{animation:grow .5s ease-out both;animation-delay:1.9s;transform-box:fill-box;transform-origin:50% 100%}
.built .c2{animation-delay:2.1s}.built .c3{animation-delay:2.3s}
@keyframes drop{from{transform:translateY(-220px);opacity:0}to{transform:none;opacity:1}}
@keyframes grow{from{transform:scaleY(0);opacity:0}to{transform:none;opacity:1}}
.flame{opacity:0;transform-box:fill-box;transform-origin:50% 100%;transition:opacity .5s}
.lit .flame{opacity:1;animation:fl 1.1s ease-in-out infinite alternate}
@keyframes fl{to{transform:scale(1.15,.9) rotate(3deg)}}
.tags{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:min(340px,100%)}
.tag{position:relative;perspective:700px;height:130px;background:none;border:0;padding:0;min-height:0;cursor:pointer}
.tag i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;font-style:normal;border-radius:10px;backface-visibility:hidden;transition:transform .7s}
.tag .f{background:var(--red);color:#ffd9de;font-size:38px;border:2px solid var(--rose)}
.tag .b{background:var(--paper);color:var(--pen);font:500 21px/1.2 var(--hand);transform:rotateY(180deg)}
.tag.flip .f{transform:rotateY(180deg)}.tag.flip .b{transform:rotateY(0)}
.gal{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;width:100%;padding:8px 6vw;flex:none}
.slot{flex:0 0 min(220px,64vw);aspect-ratio:3/4;scroll-snap-align:center;background:#fff2 center/cover;border:8px solid #fff;border-bottom-width:30px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fffc;font-size:18px;cursor:pointer;transform:rotate(-2deg);box-shadow:0 8px 24px #0008}
.slot:nth-child(even){transform:rotate(2deg)}
.letter{background:var(--paper);color:var(--pen);font:500 clamp(22px,6vw,27px)/1.45 var(--hand);padding:26px 24px;width:min(360px,100%);text-align:left;border-radius:3px;box-shadow:0 10px 30px #000a;flex:none}
.letter p{max-width:none;font:inherit;margin-bottom:.7em}
.vinyl{width:min(220px,60vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--red) 0 18%,#111 19% 22%,#222 23% 40%,#111 41% 60%,#222 61% 100%);box-shadow:0 10px 30px #000a;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#sky{position:absolute;inset:0;width:100%;height:100%}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
#ed{position:fixed;inset:0;z-index:50;background:#1a0308f5;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 18px 40px;display:none}
#ed.open{display:block}
#ed .box{max-width:440px;margin:0 auto;display:grid;gap:12px;font-size:18px}
#ed label{display:grid;gap:4px;font-size:16px;opacity:.9}
#ed input,#ed textarea,#ed select{font:inherit;font-size:17px;color:var(--ink);background:#ffffff14;border:1px solid #ffffff40;border-radius:8px;padding:10px;width:100%}
#ed textarea{min-height:64px;resize:vertical}
#ed h2{font-weight:600;font-size:24px}
#ed .row{display:flex;gap:10px}#ed .row>*{flex:1}
#link{font-size:14px!important}
.cream{background:#f4ecd9;color:#6b1a2a}
body.intro #lang button,body.intro #gear{background:#fff9;color:#6b1a2a;border-color:#6b1a2a55}
body.intro #lang button[aria-pressed=true]{background:#9b1528;color:#fff}
.env{width:min(210px,56vw);cursor:pointer;animation:bob 2.4s ease-in-out infinite}
#flap{transform-origin:100px 30px;transition:transform .7s}
.env.open #flap{transform:scaleY(-1)}
#fcv{position:absolute;inset:0;width:100%;height:100%}
.n321{font-family:var(--script),serif;font-size:clamp(120px,40vw,240px);line-height:1;color:#fff;text-shadow:0 0 40px #e0304f;animation:pop 1s ease-out}
@keyframes pop{0%{transform:scale(.4);opacity:0}30%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:.9}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}.built .tier,.built .candle{opacity:1}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const D={
en:{env:"Tap to open",cakeTap:"Tap to build your cake",title:"Happy Birthday",cdTitle:"Counting down to your birthday",u:["Days","Hours","Min","Sec"],cdDone:"Today is your day!",cont:"Continue",msg:"Before anything else: I made this just for you.",giftLine:"You have a surprise waiting for you",giftHint:"Tap the gift",hubHint:"Tap one to open",tl:["Photos & letter","Our song","Reasons","Cake"],back:"Back",songH:"Our song",songOpen:"Play our song",tagsIntro:"Reasons I love you. Tap each one.",r:["Your laugh makes any day better.","You are kind when nobody's watching.","I'm most myself with you.","You make ordinary days feel special."],cakeLine:"Your cake is waiting, {name}",cakeHint:"Tap the candle to light it",cakeLit:"Happy birthday, {name}. Make a wish.",keep:"Keep going",galIntro:"Our moments. Tap a frame to add a photo.",add:"+ photo",letter:"My love,\n\nHappy birthday, {name}. I wanted to make something that feels like you: warm, a little bit magic, and worth slowing down for.\n\nThank you for every laugh, every quiet moment, and every time you made me feel at home. I'm so lucky it's you.\n\nYours, always.",wish:"Make a wish",wishHint:"Tap the sky to send a star",toMem:"Back to the photos & letter"},

 let ms=t?t-new Date():0;const done=t&&ms<=0;if(ms<0)ms=0;

const fx=$('fx'),c=fx.getContext('2d');let P=[];
function size(){fx.width=innerWidth;fx.height=innerHeight}size();addEventListener('resize',size);
function burst(){for(let i=0;i<140;i++)P.push({x:innerWidth/2,y:innerHeight*.4,vx:(Math.random()-.5)*14,vy:-Math.random()*14-2,r:Math.random()*5+3,c:['#f5c97a','#ff9aa8','#fff','#e0304f'][i%4],life:170})}
(function loop(){c.clearRect(0,0,fx.width,fx.height);P=P.filter(p=>p.life>0);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.28;p.vx*=.99;p.life--;c.globalAlpha=Math.min(1,p.life/40);c.fillStyle=p.c;c.fillRect(p.x,p.y,p.r,p.r*1.6)});requestAnimationFrame(loop)})();

const pick=$('pick');let target;

function sky(){if(skyOn)return;skyOn=true;const k=$('sky'),x=k.getContext('2d');k.width=innerWidth;k.height=innerHeight;
const S=[...Array(90)].map(()=>({x:Math.random()*k.width,y:Math.random()*k.height,r:Math.random()*1.6+.3,t:Math.random()*6}));let W=[];
k.onclick=e=>{W.push({x:e.clientX,y:e.clientY,l:0});$('toMem').hidden=false};
(function d(){x.clearRect(0,0,k.width,k.height);S.forEach(s=>{s.t+=.03;x.globalAlpha=.4+.4*Math.sin(s.t);x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()});
W.forEach(w=>{w.l++;x.globalAlpha=Math.max(0,1-w.l/120);x.strokeStyle='#f5c97a';x.lineWidth=2;x.beginPath();x.moveTo(w.x+w.l*3,w.y-w.l*1.5);x.lineTo(w.x+w.l*3-40,w.y-w.l*1.5+20);x.stroke();x.fillStyle='#f5c97a';x.beginPath();x.arc(w.x+w.l*3,w.y-w.l*1.5,3,0,7);x.fill()});W=W.filter(w=>w.l<120);requestAnimationFrame(d)})()}

const PAL=[['#ffe3e6','#ffbac4','#ff8fa3','#e0506b'],['#fff1ee','#ffd0d6','#f58aa0','#c81e3a'],['#ffc2cc','#f58aa0','#e23a55','#9b1528']];
function flower(q,cx,cy,R,rot,ci){for(let l=0;l<4;l++){const r=R*(1-l*.2),n=7-l;for(let i=0;i<n;i++){const a=rot+l*.6+i*6.283/n;q.beginPath();q.ellipse(cx+Math.cos(a)*r*.45,cy+Math.sin(a)*r*.45,r*.55,r*.38,a,0,6.283);q.fillStyle=PAL[ci][l];q.fill();q.strokeStyle='#0000001a';q.stroke()}}}
function bloom(){const cv=$('fcv'),q=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;const W=cv.width,H=cv.height,ox=W*.8,oy=H*.5;
 const N=Math.min(350,Math.max(120,Math.round(W*H/4200)));let F=[],md=1;
 for(let i=0;i<N;i++){const px=Math.random()*(W+80)-40,py=Math.random()*(H+80)-40,d=Math.hypot(px-ox,py-oy);md=Math.max(md,d);F.push({x:px,y:py,d,R:38+Math.random()*42,rot:Math.random()*6.28,c:i%3})}
 F.sort((a,b)=>a.d-b.d);const t0=performance.now(),rd=matchMedia('(prefers-reduced-motion:reduce)').matches;
 (function f(){const t=rd?9e3:performance.now()-t0;q.clearRect(0,0,W,H);
  F.forEach(o=>{const s=(t-o.d/md*2400)/900;if(s<=0)return;const k=Math.min(1,s),e=1-Math.pow(1-k,3);flower(q,o.x,o.y,o.R*e,o.rot+(1-k)*1.5,o.c)});
  if(t<3800)requestAnimationFrame(f);else setTimeout(()=>go('cd'),500)})()}
$('envSvg').onclick=()=>{if(started)return;started=true;$('envSvg').classList.add('open');setTimeout(()=>{go('flo');bloom()},800)};
